<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366F1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlashMind" />
    <title>FlashMind — 智能闪卡</title>
    <!-- 全局错误捕获：白屏时显示错误信息，方便调试 -->
    <script>
      window.__errors = [];
      window.onerror = function(msg, src, line, col, err) {
        window.__errors.push((err && err.stack) || msg + ' ' + src + ':' + line);
        showError();
      };
      window.onunhandledrejection = function(e) {
        window.__errors.push('UnhandledRejection: ' + (e.reason && e.reason.stack || e.reason));
        showError();
      };
      function showError() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && !root.children.length) {
            root.innerHTML = '<div style="padding:24px;font-family:monospace;font-size:13px;background:#1a1a2e;color:#ff6b6b;min-height:100vh">'
              + '<h2 style="color:#fff;margin:0 0 16px">FlashMind 启动错误</h2>'
              + window.__errors.map(function(e){ return '<pre style="white-space:pre-wrap;margin:0 0 12px;background:#0d0d1a;padding:12px;border-radius:8px">' + e + '</pre>'; }).join('')
              + '</div>';
          }
        }, 2000);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
